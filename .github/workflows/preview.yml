name: Validate and build YouWELL web targets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --output=build/admin-web --dart-define=MOBILE_WEB=false --dart-define=MOBILE_PREVIEW=false --dart-define-from-file=config/env/production.example.json
      - run: flutter build web --release --no-web-resources-cdn --output=build/mobile-web --dart-define=MOBILE_WEB=true --dart-define=MOBILE_PREVIEW=false --dart-define-from-file=config/env/production.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: youwell-admin-web
          path: build/admin-web
      - uses: actions/upload-artifact@v4
        with:
          name: youwell-mobile-web
          path: build/mobile-web
