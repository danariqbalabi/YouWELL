name: youwell
description: Youth Wellness Hub - a private, supportive daily wellness companion.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  clock: ^1.1.1
  geolocator: ^14.0.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.2
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Nunito (SIL OFL, assets/fonts/Nunito-OFL.txt), static weights from the
  # Google Fonts variable font so iOS and Android render the same.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900
